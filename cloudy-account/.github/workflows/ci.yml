name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Dmaven.repo.local=.m2/repository -Xmx1024m'

jobs:
  lint:
    name: 程式碼風格檢查
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v4

      - name: 設定 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: 快取 Maven 依賴
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: 執行程式碼風格檢查
        run: |
          # @TODO: 新增 checkstyle 或 spotbugs plugin 到 pom.xml
          ./mvnw compile

  test:
    name: 單元測試與整合測試
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: cloudy_homework_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v4

      - name: 設定 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: 快取 Maven 依賴
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: 設定測試環境變數
        run: |
          echo "SPRING_PROFILES_ACTIVE=test" >> $GITHUB_ENV
          echo "SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/cloudy_homework_test" >> $GITHUB_ENV
          echo "SPRING_DATASOURCE_USERNAME=test_user" >> $GITHUB_ENV
          echo "SPRING_DATASOURCE_PASSWORD=test_password" >> $GITHUB_ENV

      - name: 執行單元測試
        run: ./mvnw test

      - name: 產生測試報告
        run: ./mvnw surefire-report:report

      - name: 上傳測試報告
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-reports
          path: target/surefire-reports/

  build:
    name: 建置應用程式
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v4

      - name: 設定 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: 快取 Maven 依賴
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: 編譯並打包應用程式
        run: ./mvnw clean package -DskipTests

      - name: 上傳建置產物
        uses: actions/upload-artifact@v3
        with:
          name: jar-artifact
          path: target/*.jar

  docker-build:
    name: 建置 Docker 映像檔
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v4

      - name: 下載建置產物
        uses: actions/download-artifact@v3
        with:
          name: jar-artifact
          path: target/

      - name: 設定 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登入 Docker Registry
        uses: docker/login-action@v3
        with:
          registry: # @TODO: 設定 Docker Registry URL (如 gcr.io)
          username: ${{ secrets.DOCKER_USERNAME }} # @TODO: 新增 GitHub Secrets
          password: ${{ secrets.DOCKER_PASSWORD }} # @TODO: 新增 GitHub Secrets

      - name: 建置並推送 Docker 映像檔
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: |
            cloudy-account:latest
            cloudy-account:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  api-test:
    name: API 自動化測試
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js (用於 Newman)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 安裝 Newman
        run: npm install -g newman

      - name: 啟動測試環境
        run: |
          # @TODO: 設定測試環境啟動指令
          # docker-compose -f docker-compose.test.yml up -d
          echo "啟動測試環境"

      - name: 等待服務啟動
        run: |
          # @TODO: 實作健康檢查等待邏輯
          sleep 30

      - name: 執行 Postman Collection 測試
        run: |
          # @TODO: 建立 Postman Collection 檔案
          # newman run docs/cloudy-account-collection.json --environment docs/test-environment.json
          echo "執行 API 測試"

      - name: 上傳測試報告
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: api-test-reports
          path: newman-reports/

  security-scan:
    name: 安全性掃描
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v4

      - name: 執行 OWASP 依賴檢查
        run: |
          # @TODO: 新增 OWASP dependency-check plugin 到 pom.xml
          ./mvnw org.owasp:dependency-check-maven:check

      - name: 上傳安全掃描報告
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-reports
          path: target/dependency-check-report.html